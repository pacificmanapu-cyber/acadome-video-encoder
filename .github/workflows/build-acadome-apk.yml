name: Build AcaDome Native APK

# ─────────────────────────────────────────────────────────────
# This workflow builds the AcaDome Native Android APK using Gradle
# It runs inside the public AcaDome-Video-Encoder repo but pulls
# code from the private AcaDome repository.
# ─────────────────────────────────────────────────────────────

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "Build type"
        required: true
        default: "release"
        type: choice
        options:
          - release
          - debug

jobs:
  build-acadome-apk:
    name: 🔨 Build AcaDome APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      # ── 1. Checkout Private AcaDome Repo ───────────────
      - name: Checkout Private AcaDome Repository
        uses: actions/checkout@v4
        with:
          repository: pacificmanapu-cyber/AcaDome-App
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}

      # ── 2. Setup Node.js ─────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # ── 3. Setup pnpm (AcaDome uses pnpm) ────────────────
      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10.26.0
          run_install: false

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      # ── 4. Setup Java 17 (Required for Gradle) ──────────
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      # ── 5. Setup Android SDK ─────────────────────────────
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # ── 6. Cache Gradle ──────────────────────────────────
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-acadome-${{ hashFiles('apps/user-native/android/**/*.gradle*', 'apps/user-native/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-acadome-

      # ── 7. Install Dependencies ──────────────────────────
      - name: Install Dependencies
        run: pnpm install

      # ── 8. Create .env File from Secrets ─────────────────
      - name: Create .env file for AcaDome
        run: |
          cat > apps/user-native/.env << 'ENVEOF'
          API_BASE_URL=${{ secrets.API_BASE_URL }}
          SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
          ENVEOF

      # ── 9. Decode Keystore (Optional) ────────────────────
      - name: Decode Keystore
        if: ${{ github.event.inputs.build_type != 'debug' }}
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > apps/user-native/android/app/upload.keystore
            echo "✅ Keystore decoded successfully"
          else
            echo "⚠️ No KEYSTORE_BASE64 secret found. Building unsigned release."
          fi

      # ── 10. Configure Signing (Optional) ─────────────────
      - name: Configure Signing
        if: ${{ github.event.inputs.build_type != 'debug' }}
        run: |
          if [ -f "apps/user-native/android/app/upload.keystore" ]; then
            cat >> apps/user-native/android/gradle.properties << SIGNEOF
          MYAPP_UPLOAD_STORE_FILE=upload.keystore
          MYAPP_UPLOAD_KEY_ALIAS=${{ secrets.KEY_ALIAS }}
          MYAPP_UPLOAD_STORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}
          MYAPP_UPLOAD_KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}
          SIGNEOF
            echo "✅ Signing config added to gradle.properties"
          fi

      # ── 11. Make gradlew executable ──────────────────────
      - name: Make gradlew executable
        working-directory: apps/user-native/android
        run: chmod +x gradlew

      # ── 12. Build APK ────────────────────────────────────
      - name: Build Release APK
        if: ${{ github.event.inputs.build_type != 'debug' }}
        working-directory: apps/user-native/android
        run: ./gradlew assembleRelease --no-daemon
        env:
          ANDROID_HOME: ${{ env.ANDROID_SDK_ROOT }}

      - name: Build Debug APK
        if: ${{ github.event.inputs.build_type == 'debug' }}
        working-directory: apps/user-native/android
        run: ./gradlew assembleDebug --no-daemon
        env:
          ANDROID_HOME: ${{ env.ANDROID_SDK_ROOT }}

      # ── 13. Find & Rename APK ────────────────────────────
      - name: Locate and Rename APK
        id: find_apk
        run: |
          BUILD_TYPE="${{ github.event.inputs.build_type || 'release' }}"
          APK_PATH=$(find apps/user-native/android/app/build/outputs/apk -name "*.apk" | head -1)

          if [ -z "$APK_PATH" ]; then
            echo "❌ No APK found!"
            exit 1
          fi

          TIMESTAMP=$(date +%Y%m%d-%H%M)
          FINAL_NAME="acadome-user-${BUILD_TYPE}-${TIMESTAMP}.apk"
          cp "$APK_PATH" "$FINAL_NAME"

          echo "apk_path=$FINAL_NAME" >> $GITHUB_OUTPUT
          echo "✅ APK ready: $FINAL_NAME ($(du -h "$FINAL_NAME" | cut -f1))"

      # ── 14. Upload APK Artifact ──────────────────────────
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: acadome-native-apk
          path: ${{ steps.find_apk.outputs.apk_path }}
          retention-days: 14
